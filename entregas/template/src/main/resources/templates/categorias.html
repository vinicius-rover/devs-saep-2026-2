<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lista de categorias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">

    <div class="container">

        <a class="navbar-brand" th:href="@{/home}">
            Template
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/usuariolista}">
                        Usuarios
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       aria-current="page"
                       th:href="@{/categorias}">
                        Categorias
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">
                        Sair
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<main class="container py-4">

    <div class="d-flex flex-column flex-md-row
                justify-content-between
                align-items-md-center
                gap-3 mb-4">

        <div>

            <h1 class="h3 mb-1">
                Categorias
            </h1>

            <p class="text-secondary mb-0">
                Lista de categorias cadastradas no sistema.
            </p>

        </div>

        <a class="btn btn-primary"
           th:href="@{/categoriainserir}">
            Nova categoria
        </a>

    </div>

    <div class="alert alert-success"
         role="alert"
         th:if="${mensagem}"
         th:text="${mensagem}">

        Categoria salva com sucesso.

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped
                              table-hover
                              align-middle
                              mb-0">

                    <thead class="table-primary">

                    <tr>

                        <th scope="col">
                            ID
                        </th>

                        <th scope="col">
                            Nome
                        </th>

                        <th scope="col" class="text-end">
                            Ações
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <!-- Lista as categorias vindas do banco -->
                    <tr th:each="categoria : ${categorias}">

                        <td th:text="${categoria.id}">
                            1
                        </td>

                        <td th:text="${categoria.nome}">
                            Eletrônicos
                        </td>

                        <td class="text-end">

                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/categoriaatualizar/{id}(id=${categoria.id})}">
                                Editar
                            </a>

                            <button
                                    th:data-id="${categoria.id}"
                                    class="excluir btn btn-sm btn-outline-danger">

                                Excluir

                            </button>

                        </td>

                    </tr>

                    <!-- Caso não existam categorias -->
                    <tr th:if="${#lists.isEmpty(categorias)}">

                        <td colspan="3"
                            class="text-center text-secondary py-4">

                            Nenhuma categoria cadastrada.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<script src="/excluir_categoria.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
